[project]
name = "upskillink-backend"
version = "0.1.0"
description = "FastAPI backend for the Upskillink mentorship platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "pydantic-settings",
  "pyjwt[crypto]",
  "psycopg[binary,pool]",
  "sqlalchemy",
  "uvicorn",
]

[dependency-groups]
dev = [
  # The test suite materialises the schema on SQLite; see tests/conftest.py.
  "aiosqlite>=0.22.1",
  "httpx",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
